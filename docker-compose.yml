services:
  dump1090:
    build: .
    image: dump1090-tar1090:latest
    container_name: dump1090-tar1090
    restart: unless-stopped
    # Direkter USB RTL-SDR Dongle auf dem Raspberry Pi:
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./graphs1090-data:/var/lib/collectd/rrd
    ports:
      - "8080:8080" # tar1090 Webkarte (http://<raspi-ip>:8080/)
      - "30003:30003" # BaseStation / SBS Output
      - "30005:30005" # Beast Binary Output
      - "30002:30002" # Raw Output
    environment:
      # Decoder-Auswahl: readsb für Maximalreichweiten-Plots (Rangemap)
      - DECODER=readsb

      # Empfänger-Hardware: RTL-SDR Dongle Device ID 1
      - DEVICE_INDEX=1

      # Empfänger-Standort (optional, Koordinaten für Entfernungsberechnung und Rangemap)
      - LAT=${LAT:-52.5200}
      - LON=${LON:-13.4050}
      - SITE_NAME=${SITE_NAME:-Meine-Station}

      # Rangemap: Tatsächliche Reichweite (Range Outline)
      - RANGE_OUTLINE_HOURS=24 # Zeitfenster für den Plot der Maximalreichweite in Stunden

      # Rangemap: Theoretische Geländereichweite (HeyWhatsThat Panorama-ID)
      # - HEYWHATSTHAT_ID=xxxxxx   # Optional: Eigene Panorama-ID von heywhatsthat.com eintragen

      # Empfänger-Tuning
      - GAIN=auto # auto (readsb Auto-Gain Algorithmus), max oder fixer Wert z.B. 49.6
      - PPM=0 # Frequenzkorrektur
      - AGGRESSIVE=true # 2-Bit CRC Korrektur (--fix-2bit)

      # tar1090 Verlaufshistorie
      - INTERVAL=8 # Sekunden zwischen Track-Snapshots
      - HISTORY_SIZE=450 # Snapshots für Verlauf (450 * 8s = 1 Stunde)
