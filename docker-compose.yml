services:
  # Fork von FlightAware dump1090-fa mit RTL-TCP Anbindung & tar1090 Web-Dashboard
  dump1090:
    build: .
    image: dump1090-tar1090:latest
    container_name: dump1090-tar1090
    restart: unless-stopped
    ports:
      - "8080:8080"   # tar1090 Webkarte (http://localhost:8080/ & http://localhost:8080/skyaware/)
      - "30003:30003" # BaseStation (SBS) Port
      - "30005:30005" # Beast Binary Port
      - "30002:30002" # Raw Output Port
    environment:
      - RTL_TCP_IP=192.168.1.100   # IP des RTL-TCP-Servers
      - RTL_TCP_PORT=1234          # Port des RTL-TCP-Servers (Standard: 1234)
      - LAT=52.5200                # Empfänger-Breitengrad (optional)
      - LON=13.4050                # Empfänger-Längengrad (optional)
      - SITE_NAME=MyStation        # Stationsname auf der tar1090-Karte
      - GAIN=max                   # max, auto oder Wert in dB (z.B. 49.6)
      - PPM=0                      # Frequenzkorrektur in PPM
      - AGGRESSIVE=true            # Aktiviert den 2-Bit CRC Korrekturmodus (--fix-2bit)
      - INTERVAL=8                 # Sekunden zwischen Track-Snapshots
      - HISTORY_SIZE=450           # Anzahl der Snapshots (450 * 8s = 1 Stunde Track-Verlauf)

  # Optional: Direkt über USB RTL-SDR Dongle betreiben
  # dump1090-usb:
