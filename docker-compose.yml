services:
  dump1090:
    build: .
    image: dump1090-tar1090:latest
    container_name: dump1090-tar1090
    restart: unless-stopped
    # Falls direkter USB RTL-SDR Dongle (unter Linux / WSL2 usbipd):
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    ports:
      - "8080:8080"   # tar1090 Webkarte (http://localhost:8080/)
      - "30003:30003" # BaseStation / SBS Output
      - "30005:30005" # Beast Binary Output
      - "30002:30002" # Raw Output
    environment:
      # Empfänger-Hardware: RTL-SDR Dongle Device ID 1
      - DEVICE_INDEX=1
      # Falls RTL-TCP Server verwendet wird (optional auskommentiert):
      # - RTL_TCP_IP=192.168.1.100
      # - RTL_TCP_PORT=1234

      # Standort: Hohenstein-Steckenroth (Rheingau-Taunus-Kreis, Hessen)
      - LAT=50.1887
      - LON=8.1244
      - SITE_NAME=Hohenstein-Steckenroth

      # Empfänger-Tuning
      - GAIN=max                   # max, auto oder dB (z.B. 49.6)
      - PPM=0                      # Frequenzkorrektur
      - AGGRESSIVE=true            # 2-Bit CRC Korrektur (--fix-2bit)

      # tar1090 Verlaufshistorie
      - INTERVAL=8                 # Sekunden zwischen Track-Snapshots
      - HISTORY_SIZE=450           # Snapshots für Verlauf (450 * 8s = 1 Stunde)
